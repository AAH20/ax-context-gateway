[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ax-context-gateway"
version = "0.1.0"
description = "Kubernetes-native Context & Memory Gateway Sidecar for Google AX (Agent Executor)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ahmed Hassan"}
]
keywords = ["kubernetes", "ai-agents", "google-ax", "context-engineering", "mcp", "sandboxing"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
ax-context-gateway = "ax_context_gateway.controller:main"
